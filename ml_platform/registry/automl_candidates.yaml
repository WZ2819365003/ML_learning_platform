# AutoML Candidate Registry — MVP predefined search space
#
# Each entry defines one training candidate that will be submitted as an
# ExperimentRun when "AutoML 一键启动" is triggered.  The concurrency is
# limited by the asyncio executor pool (default: 4 workers).
#
# Capability matrix for warm_start:
#   ✅ random_forest, random_forest_regressor
#   ❌ xgboost, xgboost_regressor, lightgbm, lightgbm_regressor,
#      logistic_regression, svm, ridge, mlp, mlp_regressor
#
# Do NOT add models that don't appear in get_trainer() / list_available_models().

classification:
  - model_type: logistic_regression
    description: "LogReg / L2 / C=1.0"
    hyperparameters:
      C: 1.0
      max_iter: 500
      solver: lbfgs

  - model_type: logistic_regression
    description: "LogReg / L1 / C=0.1"
    hyperparameters:
      C: 0.1
      penalty: l1
      max_iter: 500
      solver: saga

  - model_type: random_forest
    description: "RF / 100 trees / depth=None"
    hyperparameters:
      n_estimators: 100
      max_depth: null
      min_samples_leaf: 1

  - model_type: random_forest
    description: "RF / 300 trees / depth=8"
    hyperparameters:
      n_estimators: 300
      max_depth: 8
      min_samples_leaf: 2

  - model_type: svm
    description: "SVM / RBF / C=1.0"
    hyperparameters:
      C: 1.0
      kernel: rbf
      probability: true

  - model_type: mlp
    description: "MLP / hidden=100 / adam"
    hyperparameters:
      hidden_layer_sizes: [100]
      learning_rate_init: 0.001
      max_iter: 300

  - model_type: mlp
    description: "MLP / hidden=128-64 / adam"
    hyperparameters:
      hidden_layer_sizes: [128, 64]
      learning_rate_init: 0.0005
      max_iter: 400

  - model_type: xgboost
    description: "XGBoost / lr=0.1 / depth=6"
    hyperparameters:
      n_estimators: 200
      learning_rate: 0.1
      max_depth: 6

  - model_type: xgboost
    description: "XGBoost / lr=0.05 / depth=4"
    hyperparameters:
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 4

  - model_type: lightgbm
    description: "LightGBM / lr=0.1"
    hyperparameters:
      n_estimators: 200
      learning_rate: 0.1
      num_leaves: 31

  - model_type: lightgbm
    description: "LightGBM / lr=0.05 / more leaves"
    hyperparameters:
      n_estimators: 300
      learning_rate: 0.05
      num_leaves: 63

regression:
  - model_type: random_forest_regressor
    description: "RF Regressor / 100 trees"
    hyperparameters:
      n_estimators: 100
      max_depth: null

  - model_type: xgboost_regressor
    description: "XGBoost Regressor / lr=0.1"
    hyperparameters:
      n_estimators: 200
      learning_rate: 0.1
      max_depth: 6

  - model_type: lightgbm_regressor
    description: "LightGBM Regressor / lr=0.1"
    hyperparameters:
      n_estimators: 200
      learning_rate: 0.1
      num_leaves: 31

  - model_type: ridge
    description: "Ridge Regressor / alpha=1.0"
    hyperparameters:
      alpha: 1.0

# Warm-start capable models (can use parent_run_id for incremental training)
warm_start_capable:
  - random_forest
  - random_forest_regressor
