version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: ml_platform_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: ml_platform_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ml_platform
      POSTGRES_PASSWORD: ml_platform_secret
      POSTGRES_DB: ml_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
