user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 1024M;

    # Upstream services
    #
    # 容器名只在 nginx 启动 / reload 时解析一次，之后一直用缓存的 IP。backend、
    # worker 一起 --force-recreate 时谁先起来谁先拿地址：2026-09-14 那次 worker
    # 抢走了 172.18.0.5，backend 换到 .6，nginx 继续往 .5:8000 转发，所有 /api
    # 请求 502 了一整夜，而 backend 自己的健康检查一直是绿的。
    #
    # resolver 指向 Docker 内置 DNS，`resolve` 让 nginx 按 valid 周期重新解析
    # （开源版 1.27.3+ 支持，需要配合 zone）。容器换了 IP 最多 10 秒后自动跟上，
    # 部署不再依赖「记得 reload nginx」。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream frontend {
        zone upstream_frontend 64k;
        server frontend:3000 resolve;
    }

    upstream backend {
        zone upstream_backend 64k;
        server backend:8000 resolve;
    }

    server {
        listen 80;
        server_name _;

        # Backend health (public, unauthenticated). MUST come before the
        # catch-all `location /` or it falls through to the SPA and returns
        # HTML — which breaks both external health probes and the frontend's
        # environment badge (it reads `environment` from this JSON).
        location = /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Build assets are content-hashed by Vite (index-DOb6LpCI.js), so a
        # changed file always gets a new name and these can be cached forever.
        location /assets/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Frontend (root)
        #
        # The SPA shell must NOT be cached. It is the only unhashed file, and it
        # is what names the hashed chunks — so a browser holding a stale
        # index.html keeps loading the *previous* build's JS and never sees a
        # deploy, no matter how often the user reloads. This served an old
        # useLogStream chunk (pointing the log socket at ws://127.0.0.1:8000)
        # for a full deploy cycle before anyone worked out why.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache" always;

            # Vite HMR support
            proxy_read_timeout 86400;
        }

        # API routes → backend:8000 (keep /api prefix; backend mounts routers at /api/*)
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # For large file uploads
            client_max_body_size 1024M;

            # AI report generation makes one overview call plus two calls per
            # sub-report and runs well past nginx's 60s default, which returned
            # a 504 to the browser while the backend kept working and archived
            # a report nobody saw.
            proxy_read_timeout 600;
            proxy_send_timeout 600;
        }

        # Inference routes (no /api prefix in backend)
        location /inference/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket support for real-time logs
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
}
