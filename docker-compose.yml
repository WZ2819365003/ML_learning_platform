services:
  mysql:
    image: mysql:8.0
    container_name: ml_platform_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: ml_platform
    ports:
      - "3307:3306"
    volumes:
      - ml_mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --sort-buffer-size=8388608
      --read-rnd-buffer-size=4194304
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "root", "-p123456", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ml_platform_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ml_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ml_platform_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "mlplatform"
      MINIO_ROOT_PASSWORD: "mlplatform123"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - ml_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ml_mysql_data:
  ml_minio_data:
  ml_redis_data:
