name: Backend pytest

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml_platform/requirements.txt

      - name: Install dependencies
        working-directory: ml_platform
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: ml_platform
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          S3_ENABLED: "false"
        run: |
          python -m pytest tests/ -q --tb=short
