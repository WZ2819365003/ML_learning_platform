name: Docker build

on:
  pull_request:
    branches: [main, dev]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t ml-platform-backend:ci .

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t ml-platform-frontend:ci .
